<title>Mapa de Sondas</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Layout: top bar (counter + actions) above one full-width printed sheet; sheet scrolls sideways when zoomed. */
  :root {
    --bg: #eceff2;
    --fg: #14181d;
    --muted: #586471;
    --panel: #ffffff;
    --line: #cfd5db;
    --accent: #1f4d7a;
    --danger: #b3262e;
    --on-accent: #ffffff;
    --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1216; --fg: #e8ecf0; --muted: #8b97a3; --panel: #171d23; --line: #2a323a;
      --accent: #6aa6dc; --danger: #ee6b72; --on-accent: #0e1216; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1216; --fg: #e8ecf0; --muted: #8b97a3; --panel: #171d23; --line: #2a323a;
    --accent: #6aa6dc; --danger: #ee6b72; --on-accent: #0e1216; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px;
    padding-block: 14px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .count { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .count .n { font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .count .of { font-family: var(--f-display); font-weight: 600; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count .lbl { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: 600 15px/1 var(--f-body); min-height: 44px; padding: 0 16px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible, .planet:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.ghost { background: transparent; }
  button:active { transform: translateY(1px); }
  .sheet {
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    overflow: auto; overscroll-behavior: contain; max-width: 100%;
    touch-action: pan-x pan-y pinch-zoom;
  }
  svg.map { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
  .sheet.zoom svg.map { width: 250%; }
  .planet { cursor: pointer; outline: none; }
  .planet .hit { fill: transparent; }
  .planet .mark { fill: #000; opacity: 0; transition: opacity .12s ease; }
  .planet.on .mark { opacity: 1; }
  .planet:focus-visible .hit { stroke: #1f4d7a; stroke-width: 4; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.45; max-width: 65ch; }
  @media (prefers-reduced-motion: reduce) { .planet .mark { transition: none; } }
</style>

<script>
(function () {
  var PLANETS = [
    ["Ryloth",1472,62,40],["Tatooine",1160,64,32],["Kessel",626,84,38],["Mon Calamari",196,91,50],
    ["Nal Hutta",824,103,36],["Geonosis",1360,202,26],["Utapau",1629,220,44],["Rodia",1108,238,40],
    ["Saleucami",534,246,48],["Bothawui",948,266,35],["Felucia",283,290,55],["Toydaria",771,310,32],
    ["Yavin",106,390,38],["Naboo",1244,392,40],["Malastare",976,492,28],["Dagobah",1350,506,22],
    ["Kashyyyk",728,512,32],["Mustafar",1584,568,60],["Dathomir",397,587,32],["Mandalore",608,600,34],
    ["Dantooine",86,610,40],["Sullust",1168,640,38],["Cato Neimoidia",1007,684,47],["Mygeeto",265,726,39],
    ["Hoth",1618,758,33],["Alderaan",704,778,34],["Bespin",1395,802,30],["Ord Mantell",566,844,28],
    ["Ilum",342,904,39],["Corellia",1123,904,40],["Endor",1498,926,38],["Coruscant",860,933,52]
  ];
  var KEY = "rebellion-probe-marks-v1";
  var NS = "http://www.w3.org/2000/svg";
  var layer = document.getElementById("planets");
  var nEl = document.getElementById("n");
  var undoBtn = document.getElementById("undo");
  var marks = {};
  var backup = null;
  var nodes = {};

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (saved && typeof saved === "object") marks = saved;
  } catch (e) {}

  function save() { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} }

  function paint(name) {
    var g = nodes[name];
    var on = !!marks[name];
    g.classList.toggle("on", on);
    g.setAttribute("aria-pressed", on ? "true" : "false");
  }

  function update() {
    var c = 0;
    PLANETS.forEach(function (p) { if (marks[p[0]]) c++; });
    nEl.textContent = c;
  }

  function toggle(name) {
    if (marks[name]) delete marks[name]; else marks[name] = 1;
    backup = null; undoBtn.hidden = true;
    paint(name); update(); save();
  }

  PLANETS.forEach(function (p) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("class", "planet");
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", p[0]);
    var hit = document.createElementNS(NS, "circle");
    hit.setAttribute("class", "hit");
    hit.setAttribute("cx", p[1]); hit.setAttribute("cy", p[2]); hit.setAttribute("r", p[3] + 14);
    var mark = document.createElementNS(NS, "circle");
    mark.setAttribute("class", "mark");
    mark.setAttribute("cx", p[1]); mark.setAttribute("cy", p[2]); mark.setAttribute("r", p[3] + 1);
    g.appendChild(hit); g.appendChild(mark);
    g.addEventListener("click", function () { toggle(p[0]); });
    g.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(p[0]); }
    });
    layer.appendChild(g);
    nodes[p[0]] = g;
    paint(p[0]);
  });
  update();

  document.getElementById("clear").addEventListener("click", function () {
    if (!Object.keys(marks).length) return;
    backup = marks; marks = {};
    PLANETS.forEach(function (p) { paint(p[0]); });
    update(); save();
    undoBtn.hidden = false;
  });

  undoBtn.addEventListener("click", function () {
    if (!backup) return;
    marks = backup; backup = null;
    PLANETS.forEach(function (p) { paint(p[0]); });
    update(); save();
    undoBtn.hidden = true;
  });

  var zoomBtn = document.getElementById("zoom");
  var sheet = document.getElementById("sheet");
  zoomBtn.addEventListener("click", function () {
    var z = sheet.classList.toggle("zoom");
    zoomBtn.textContent = z ? "Reducir" : "Ampliar";
    zoomBtn.setAttribute("aria-pressed", z ? "true" : "false");
    if (!z) { sheet.scrollLeft = 0; sheet.scrollTop = 0; }
  });
})();
</script>
